classification:
    method: geneformer
    module: models.gf_finetune
    class: GFFineTuneModel
    viz: True
    eval: True
    params:
        model: Geneformer-V1-10M
        version: V1
        model_dir: Geneformer   # MODELS_PATH root (see setup_path.MODELS_PATH)
        dict_dir: Geneformer/gf_dicts_v1 #genefromer 2
        model_input_size: 2048
        batch_size: 64          # used by cell-level paths (avg/vote); MIL uses bag batch_size=1

        # --- MIL memory / throughput knobs ---
        # Match v7 effective MIL defaults, except keep full model context (2048).
        # v7 hardcoded max_number_genes=512; freeze was ignored; lr=2e-5; chunk=128; no AMP.
        max_number_genes: 2048      # gene tokens per cell (match model_input_size; not v7's 512)
        max_cells_per_bag: 500      # cells per MIL bag
        max_cells_per_patient: 1000 # cap cells used per patient before bagging
        mil_chunk_size: 128         # v7 default chunk size
        gradient_checkpointing: true
        checkpoint_chunks: false    # did not exist in v7; omit used to default on
        use_amp: false              # v7 trained in fp32

        # --- optimizer / schedule ---
        epoch: 5
        freeze_layers: 0            # v7 MIL ignored freeze_layers
        learning_rate: 0.00002      # v7 hardcoded AdamW lr
        weight_decay: 0.01
        warmup_ratio: 0.0
        pos_weight: auto   # bag-level n_neg/n_pos; ~3–4 on chemo/outcome

        train_funcs:
            # - avg
            - mil
            # - vote
        cv: True
        # onesplit: True
