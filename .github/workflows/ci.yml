name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Validate packaged schemas and examples
        run: |
          scfm-eval candidate validate examples/models/candidates/scgpt.json
          scfm-eval contract validate model-spec \
            examples/models/planning/model-spec.json
          scfm-eval contract validate integration-plan \
            examples/models/planning/integration-plan.json
          scfm-eval contract validate execution-manifest \
            examples/models/planning/execution-manifest.json
          scfm-eval contract validate execution-approval \
            examples/models/planning/execution-approval.json
          scfm-eval contract validate review-decision \
            examples/models/planning/review-decision.json

      - name: Run unit and dual-gate tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate YAML syntax
        run: python scripts/validate_all_yaml.py --skip-exp
