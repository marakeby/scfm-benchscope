dataset:
  module: data.data_loader
  class: H5ADLoader
  path: brca_full/cells_only_13gigs.h5ad
  load_raw: false
  label_key: cell_types
  batch_key: donor_id
  filter:
  - column: timepoint
    values:
    - Pre
  layer_name: X
  train_test_split: data_splits/brca_full/brca_cell_type/train_test_split.json
  cv_splits: data_splits/brca_full/brca_cell_type/cv_splits.json
  label_map:
    Pre: 0
    Post: 1
qc:
  min_genes: 10
  min_cells: 10
preprocessing:
  normalize: true
  target_sum: 10000
  apply_log1p: true
hvg:
  batch_key: batch
  n_top_genes: 4096
  flavor: seurat
embedding:
  method: nicheformer
  module: features.nicheformer_extractor
  class: NicheformerExtractor
  viz: true
  eval: true
  params:
    checkpoint_path: nicheformer/nicheformer.ckpt
    technology_mean_path: nicheformer/dissociated_mean_script.npy
    technology_gene_reference_h5ad: nicheformer/model.h5ad
    gene_name_id_dict: Geneformer/gf_dicts_v2/gene_name_id_dict_gc104M.pkl
classification:
  module: models.classify
  class: ClassifierPipeline
  params:
    model: randomforest
    n_estimators: 100
    max_depth: 5
    train_funcs:
    - avg
    - mil
    - vote
    cv: true
    mil:
      debug: false
      top_k: 20
      holdout_fraction: 0.0
  viz: true
  eval: true
run_id: nicheformer_nicheformer_brca_cell_type
