embedding:
  method: nicheformer
  module: features.nicheformer_extractor
  class: NicheformerExtractor
  viz: true
  eval: true
  params:
    # HuggingFace Hub repo (NOT a path under MODELS_PATH). Weights cache in ~/.cache/huggingface/.
    hf_model_id: "theislab/Nicheformer"
    trust_remote_code: true
    technology_mean_path: nicheformer/dissociated_mean_script.npy
    # Gene order for vocabulary (auto: model.h5ad beside the .npy if present).
    technology_gene_reference_h5ad: nicheformer/model.h5ad
    # Symbol → Ensembl (same pickle as CellPLM / scSimilarity / Geneformer v2).
    gene_name_id_dict: Geneformer/gf_dicts_v2/gene_name_id_dict_gc104M.pkl
    # HF tokenizer applies sf_normalize + technology_mean + log1p; prefer raw counts in adata.X.
    # If your dataset YAML applies log1p, add ``preprocessing: {skip: true}`` on the exp YAML.
    batch_size: 32
    # embedding_layer: -1
    # use_gpu: true
    modality: dissociated
    specie: human
