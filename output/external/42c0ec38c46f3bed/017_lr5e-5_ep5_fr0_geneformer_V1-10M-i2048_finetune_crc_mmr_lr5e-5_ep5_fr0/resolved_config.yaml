dataset:
  module: data.data_loader
  class: H5ADLoader
  path: crc/crc_tcell_tumor_MMRd_vs_MMRp_min200cells.h5ad
  load_raw: false
  label_key: MMRStatusTumor
  batch_key: donor_id
  layer_name: X
  train_test_split: data_splits/crc_mmr/train_test_split.json
  cv_splits: data_splits/crc_mmr/cv_splits.json
  label_map:
    MMRd: 0
    MMRp: 1
qc:
  min_genes: 10
  min_cells: 10
preprocessing:
  normalize: true
  target_sum: 10000
  apply_log1p: true
hvg:
  batch_key: batch
  n_top_genes: 4096
  flavor: seurat
classification:
  method: geneformer
  module: models.gf_finetune
  class: GFFineTuneModel
  viz: true
  eval: true
  params:
    model: Geneformer-V1-10M
    version: V1
    model_dir: Geneformer
    dict_dir: Geneformer/gf_dicts_v1
    model_input_size: 2048
    batch_size: 64
    epoch: 5
    freeze_layers: 0
    learning_rate: 5.0e-05
    weight_decay: 0.01
    warmup_ratio: 0.0
    train_funcs:
    - mil
    cv: true
run_id: geneformer_V1-10M-i2048_finetune_crc_mmr_lr5e-5_ep5_fr0
embedding:
  skip: true
  viz: false
  eval: false
