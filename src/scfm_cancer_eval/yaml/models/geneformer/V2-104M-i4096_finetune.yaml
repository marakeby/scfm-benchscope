classification:
    module: models.gf_finetune
    class: GFFineTuneModel
    params:
        model: Geneformer-V2-104M
        version: V2
        model_dir: Geneformer   # MODELS_PATH root (see setup_path.MODELS_PATH)
        dict_dir: Geneformer/gf_dicts_v2 #genefromer 2
        model_input_size: 4096
        batch_size: 32          # used by cell-level paths (avg/vote); MIL uses bag batch_size=1

        # Paper / v7 MIL recipe (June 2026 code at 5cbf104). YAML then listed
        # freeze_layers=6, lr=5e-5, weight_decay=1e-5, but MIL ignored those and
        # used the hardcoded values below. The later AMP + checkpoint_chunks
        # recipe (v8) collapsed fold scores; do not re-enable it for paper runs.
        max_number_genes: 512
        max_cells_per_bag: 500
        max_cells_per_patient: 1000
        mil_chunk_size: 128
        gradient_checkpointing: true   # v7 always enabled BERT checkpointing
        checkpoint_chunks: false       # did not exist in v7
        use_amp: false                 # v7 trained in fp32
        empty_cache_between_bags: false

        epoch: 3
        freeze_layers: 0               # v7 MIL did not freeze encoder layers
        learning_rate: 2.0e-5          # v7 hardcoded AdamW lr (yaml 5e-5 was unused)
        weight_decay: 0.01             # AdamW default; yaml 1e-5 was unused
        warmup_ratio: 0
        # pos_weight omitted: v7 used unweighted BCE

        train_funcs:
            # - avg
            - mil
            # - vote
        cv: True
    viz: True
    eval: True
