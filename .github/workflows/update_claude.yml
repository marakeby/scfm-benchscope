name: Update SCFM database

on:
  workflow_dispatch:

permissions:
  contents: write   # needed to commit updated files back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic
          pip install --no-deps -e .

      - name: Run discovery agent
        working-directory: docs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent_claude.py

      - name: Commit and push changes
        run: |
          git config user.name  "scfm-agent[bot]"
          git config user.email "scfm-agent@users.noreply.github.com"
          git add docs/models.json docs/models.html docs/candidates
          # Only commit if there are actual changes
          git diff --cached --quiet || git commit -m "chore: update SCFM database $(date -u '+%Y-%m-%d')"
          git push
